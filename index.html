<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مودا · Moda — Affordable Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--fg:#1d1b19;--mut:#6f6a63;--card:#fff;--line:#e8e2d8;--acc:#b4532a;--on:#fff;--ok:#2e7d4f;--bad:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151311;--fg:#f3eee6;--mut:#a39b8f;--card:#1f1c19;--line:#33302b;--acc:#e0804f;--on:#151311;--ok:#5cc08a;--bad:#ef7a6c;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151311;--fg:#f3eee6;--mut:#a39b8f;--card:#1f1c19;--line:#33302b;--acc:#e0804f;--on:#151311;--ok:#5cc08a;--bad:#ef7a6c;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hi{max-width:1200px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:24px;letter-spacing:.5px;color:var(--acc);margin-inline-end:auto}
#q{flex:1 1 220px;max-width:420px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);order:3}
.ib{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:600}
.ib b{background:var(--acc);color:var(--on);border-radius:99px;padding:0 7px;margin-inline-start:4px;font-size:13px}
main{max-width:1200px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--acc),#6b2d12);color:#fff;border-radius:20px;padding:36px 28px;margin-bottom:18px}
.hero h1{font-size:clamp(24px,5vw,40px);font-weight:800}.hero p{opacity:.9;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 18px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0;color:var(--mut);font-size:14px}
.bar select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.bar input[type=range]{accent-color:var(--acc);vertical-align:middle;width:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0002}
.img{aspect-ratio:4/5;display:grid;place-items:center;font-size:64px;background:hsl(var(--h) 38% 82%);position:relative}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--acc);color:var(--on);font-size:12px;padding:1px 8px;border-radius:99px}
.oos{position:absolute;inset:auto 0 0;background:#000a;color:#fff;font-size:13px;text-align:center;font-style:normal;padding:3px}
.ci{padding:10px 12px}.ci h3{font-size:15px;font-weight:600}
.pr{font-weight:800;color:var(--acc)}.pr s{color:var(--mut);font-weight:400;font-size:13px}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--mut)}
.m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.m.on{display:flex}.m.side{justify-content:flex-end;padding:0}
.mb{background:var(--bg);border-radius:20px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:22px;position:relative}
.side .mb{height:100%;max-height:none;border-radius:0;width:min(420px,100%)}
.x{position:absolute;top:12px;inset-inline-end:14px;border:0;background:none;font-size:20px;color:var(--mut)}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:12px 20px;font-weight:700;width:100%;margin-top:12px}
.btn.s{width:auto;margin:0;padding:6px 12px;font-size:13px}.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}.btn.d{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sz{position:relative}.sz input{position:absolute;opacity:0}
.sz span{display:block;min-width:44px;text-align:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sz:has(input:checked) span{background:var(--fg);color:var(--bg)}
.pv{display:grid;place-items:center;font-size:90px;border-radius:14px;aspect-ratio:16/9;background:hsl(var(--h) 38% 82%);margin-bottom:12px}
.ln{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.th{display:grid;place-items:center;font-size:30px;height:54px;border-radius:10px;background:hsl(var(--h) 38% 82%)}
.ln small{display:block;color:var(--mut)}.r{text-align:end;font-weight:700}
.q{display:inline-flex;align-items:center;gap:8px;margin-top:4px}.q button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.lk{border:0;background:none;color:var(--bad);display:block;margin-inline-start:auto}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.b{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
label.f{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:3px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.st b{display:block;font-size:24px;color:var(--acc)}.st span{color:var(--mut);font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
td input{width:70px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.low{color:var(--bad);font-weight:700}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.oc header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:90;display:none}
footer{text-align:center;color:var(--mut);padding:30px 16px;font-size:13px}
</style>
</head>
<body>
<header class="hd"><div class="hi">
<div class="brand" id="brand"></div>
<input id="q" type="search" oninput="ST.q=this.value;drawGrid()">
<button class="ib" id="adm" onclick="toggleAdmin()"></button>
<button class="ib" id="lg" onclick="ST.lang=ST.lang=='ar'?'en':'ar';render()"></button>
<button class="ib" id="th" onclick="theme()" aria-label="theme">◐</button>
<button class="ib" onclick="cartM()">🛍️ <b id="cc">0</b></button>
</div></header>
<main id="app"></main>
<footer id="ft"></footer>
<div class="m" id="m" onclick="if(event.target===this)closeM()"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const T={ar:{brand:'مودا',search:'ابحث عن ملابس…',all:'الكل',women:'نساء',men:'رجال',kids:'أطفال',acc:'إكسسوارات وأحذية',heroT:'أناقة تناسب ميزانيتك',heroS:'أحدث صيحات الموضة بأسعار مناسبة، مع توصيل لجميع الولايات.',size:'المقاس',any:'الكل',max:'أقصى سعر',sortl:'الترتيب',o_new:'الأحدث',o_lo:'السعر: الأقل',o_hi:'السعر: الأعلى',items:'منتج',add:'أضف إلى السلة',cart:'السلة',empty:'سلتك فارغة',sub:'المجموع الفرعي',ship:'التوصيل',free:'مجاني',total:'الإجمالي',checkout:'إتمام الطلب',name:'الاسم الكامل',phone:'رقم الهاتف',wil:'الولاية',addr:'العنوان',place:'تأكيد الطلب',cod:'الدفع عند الاستلام',ok:'تم استلام طلبك!',ordno:'رقم الطلب',admin:'لوحة التحكم',shop:'المتجر',ov:'نظرة عامة',prods:'المنتجات',ords:'الطلبات',rev:'الإيرادات',low:'مخزون منخفض',newp:'+ منتج جديد',edit:'تعديل',del:'حذف',save:'حفظ',cancel:'إلغاء',stock:'المخزون',oos:'نفد',none:'لا توجد نتائج مطابقة',pin:'رمز الدخول (تجريبي: 1234)',enter:'دخول',wrong:'رمز خاطئ',added:'تمت الإضافة إلى السلة',cur:'د.ج',nar:'الاسم بالعربية',nen:'الاسم بالإنجليزية',cat:'الفئة',price:'السعر',old:'السعر قبل الخصم',sizes:'المقاسات (مفصولة بفاصلة)',icon:'الرمز',only:'المتوفر فقط',confirm:'هل أنت متأكد؟',reset:'إعادة بيانات العرض',noord:'لا توجد طلبات بعد',s_new:'جديد',s_proc:'قيد التجهيز',s_ship:'تم الشحن',s_done:'تم التسليم',s_canc:'ملغى',ftx:'© مودا — موضة بأسعار في المتناول',lowl:'منتجات تحتاج إعادة تخزين',nstock:'الكمية غير متوفرة'},
en:{brand:'MODA',search:'Search clothing…',all:'All',women:'Women',men:'Men',kids:'Kids',acc:'Accessories & Shoes',heroT:'Style that fits your budget',heroS:'The latest fashion at friendly prices, delivered to every region.',size:'Size',any:'All',max:'Max price',sortl:'Sort',o_new:'Newest',o_lo:'Price: low to high',o_hi:'Price: high to low',items:'items',add:'Add to cart',cart:'Cart',empty:'Your cart is empty',sub:'Subtotal',ship:'Shipping',free:'Free',total:'Total',checkout:'Checkout',name:'Full name',phone:'Phone number',wil:'Region / wilaya',addr:'Address',place:'Place order',cod:'Cash on delivery',ok:'Order received!',ordno:'Order number',admin:'Admin',shop:'Store',ov:'Overview',prods:'Products',ords:'Orders',rev:'Revenue',low:'Low stock',newp:'+ New product',edit:'Edit',del:'Delete',save:'Save',cancel:'Cancel',stock:'Stock',oos:'Sold out',none:'No matching products',pin:'Access code (demo: 1234)',enter:'Sign in',wrong:'Wrong code',added:'Added to cart',cur:'DA',nar:'Name (Arabic)',nen:'Name (English)',cat:'Category',price:'Price',old:'Original price',sizes:'Sizes (comma separated)',icon:'Icon',only:'Only left',confirm:'Are you sure?',reset:'Reset demo data',noord:'No orders yet',s_new:'New',s_proc:'Processing',s_ship:'Shipped',s_done:'Delivered',s_canc:'Cancelled',ftx:'© Moda — fashion within reach',lowl:'Products to restock',nstock:'Not enough stock'}};
const SIZES=['S','M','L','XL','4Y','6Y','8Y','30','32','34','36','40','41','42','43','OS'];
const STAT=['new','proc','ship','done','canc'];
const ST={lang:'ar',cat:'all',q:'',size:'',max:10000,sort:'new',cart:[],view:'shop',tab:'ov',auth:false};
const P=(id,ar,en,cat,price,old,sizes,stock,icon,h)=>({id,ar,en,cat,price,old,sizes,stock,icon,h});
function seed(){return{nid:13,n:1001,pin:'1234',orders:[],products:[
P(1,'فستان صيفي مزهّر','Floral summer dress','women',3200,4200,['S','M','L'],14,'👗',20),
P(2,'قميص كتان رجالي','Men’s linen shirt','men',2400,0,['M','L','XL'],22,'👔',210),
P(3,'جينز مستقيم','Straight jeans','men',3600,4500,['30','32','34','36'],9,'👖',215),
P(4,'تي شيرت قطني','Cotton tee','men',1200,0,['S','M','L','XL'],40,'👕',30),
P(5,'عباية عصرية','Modern abaya','women',5500,6500,['S','M','L'],6,'🧥',280),
P(6,'معطف شتوي','Winter coat','women',7800,9800,['M','L'],4,'🧥',340),
P(7,'هودي أطفال','Kids hoodie','kids',2100,0,['4Y','6Y','8Y'],18,'👚',190),
P(8,'فستان بنات للحفلات','Girls’ party dress','kids',2800,3400,['4Y','6Y','8Y'],11,'👗',330),
P(9,'حذاء رياضي','Sneakers','acc',4900,0,['40','41','42','43'],12,'👟',200),
P(10,'حقيبة كتف','Shoulder bag','acc',3300,3900,['OS'],15,'👜',25),
P(11,'وشاح حريري','Silk scarf','acc',1500,0,['OS'],25,'🧣',300),
P(12,'قبعة صيفية','Summer hat','acc',1100,0,['OS'],3,'👒',45)]}}
let DB=(()=>{try{const d=JSON.parse(localStorage.getItem('moda_db'));if(d&&d.products)return d}catch(e){}return seed()})();
const save=()=>{try{localStorage.setItem('moda_db',JSON.stringify(DB))}catch(e){}};
const t=k=>T[ST.lang][k]||k;
const fmt=n=>(+n).toLocaleString(ST.lang=='ar'?'ar-DZ':'en-US')+' '+t('cur');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prod=id=>DB.products.find(p=>p.id==id);
const nm=p=>esc(p[ST.lang]||p.ar);
function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>e.style.display='none',1800)}
function theme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function M(h,cls){const m=$('#m');m.className='m on '+(cls||'');m.innerHTML=`<div class="mb"><button class="x" onclick="closeM()">✕</button>${h}</div>`}
const closeM=()=>{$('#m').className='m'};

function render(){
 const r=document.documentElement;r.lang=ST.lang;r.dir=ST.lang=='ar'?'rtl':'ltr';
 $('#q').placeholder=t('search');$('#q').style.display=ST.view=='admin'?'none':'';
 $('#lg').textContent=ST.lang=='ar'?'EN':'عربي';$('#brand').textContent=t('brand');
 $('#adm').textContent=ST.view=='admin'?t('shop'):t('admin');$('#ft').textContent=t('ftx');
 $('#cc').textContent=ST.cart.reduce((a,c)=>a+c.qty,0);
 $('#app').innerHTML=ST.view=='admin'?adminHTML():shopHTML();
 if(ST.view!='admin')drawGrid();
}
/* ---------- Storefront ---------- */
const shopHTML=()=>`<section class="hero"><h1>${t('heroT')}</h1><p>${t('heroS')}</p></section>
<div class="chips">${['all','women','men','kids','acc'].map(c=>`<button class="chip ${ST.cat==c?'on':''}" onclick="ST.cat='${c}';render()">${t(c)}</button>`).join('')}</div>
<div class="bar"><label>${t('size')} <select onchange="ST.size=this.value;drawGrid()"><option value="">${t('any')}</option>${SIZES.map(s=>`<option ${ST.size==s?'selected':''}>${s}</option>`).join('')}</select></label>
<label>${t('max')} <input type="range" min="500" max="10000" step="500" value="${ST.max}" oninput="ST.max=+this.value;$('#mx').textContent=fmt(ST.max);drawGrid()"> <b id="mx">${fmt(ST.max)}</b></label>
<label>${t('sortl')} <select onchange="ST.sort=this.value;drawGrid()">${['new','lo','hi'].map(o=>`<option value="${o}" ${ST.sort==o?'selected':''}>${t('o_'+o)}</option>`).join('')}</select></label><span id="cnt"></span></div>
<div class="grid" id="grid"></div>`;
function filtered(){const q=ST.q.trim().toLowerCase();
 const l=DB.products.filter(p=>(ST.cat=='all'||p.cat==ST.cat)&&p.price<=ST.max&&(!ST.size||p.sizes.includes(ST.size))&&(!q||(p.ar+' '+p.en).toLowerCase().includes(q)));
 l.sort(ST.sort=='lo'?(a,b)=>a.price-b.price:ST.sort=='hi'?(a,b)=>b.price-a.price:(a,b)=>b.id-a.id);return l}
const card=p=>`<article class="card" onclick="openP(${p.id})"><div class="img" style="--h:${p.h}">${p.icon}${p.old?`<b class="tag">-${Math.round(100-p.price/p.old*100)}%</b>`:''}${p.stock<1?`<i class="oos">${t('oos')}</i>`:''}</div><div class="ci"><h3>${nm(p)}</h3><div class="pr">${fmt(p.price)}${p.old?` <s>${fmt(p.old)}</s>`:''}</div></div></article>`;
function drawGrid(){const l=filtered();$('#grid').innerHTML=l.length?l.map(card).join(''):`<p class="empty">${t('none')}</p>`;$('#cnt').textContent=l.length+' '+t('items')}
function openP(id){const p=prod(id);
 M(`<div class="pv" style="--h:${p.h}">${p.icon}</div><h2>${nm(p)}</h2><div class="pr" style="font-size:20px">${fmt(p.price)}${p.old?` <s>${fmt(p.old)}</s>`:''}</div>
 ${p.stock>0&&p.stock<5?`<small class="low">${t('only')}: ${p.stock}</small>`:''}
 <p style="margin-top:10px;color:var(--mut)">${t('size')}</p><div class="sizes">${p.sizes.map((s,i)=>`<label class="sz"><input type="radio" name="sz" value="${s}" ${i?'':'checked'}><span>${s}</span></label>`).join('')}</div>
 <button class="btn" ${p.stock<1?'disabled':''} onclick="addCart(${p.id})">${p.stock<1?t('oos'):t('add')}</button>`)}
function addCart(id){const p=prod(id),size=document.querySelector('input[name=sz]:checked').value;
 const c=ST.cart.find(x=>x.id==id&&x.size==size),have=ST.cart.filter(x=>x.id==id).reduce((a,x)=>a+x.qty,0);
 if(have>=p.stock)return toast(t('nstock'));
 c?c.qty++:ST.cart.push({id,size,qty:1});closeM();toast(t('added'));$('#cc').textContent=ST.cart.reduce((a,c)=>a+c.qty,0)}
function totals(){const sub=ST.cart.reduce((a,c)=>a+prod(c.id).price*c.qty,0);const ship=!sub||sub>=8000?0:600;return{sub,ship,tot:sub+ship}}
function cartM(){
 if(!ST.cart.length)return M(`<h2>${t('cart')}</h2><p class="empty">${t('empty')}</p>`,'side');
 const T=totals();
 M(`<h2 style="margin-bottom:8px">${t('cart')}</h2>${ST.cart.map((c,i)=>{const p=prod(c.id);return`<div class="ln"><span class="th" style="--h:${p.h}">${p.icon}</span><div><b>${nm(p)}</b><small>${t('size')}: ${c.size}</small><div class="q"><button onclick="chg(${i},-1)">−</button>${c.qty}<button onclick="chg(${i},1)">+</button></div></div><div class="r">${fmt(p.price*c.qty)}<button class="lk" onclick="rm(${i})">✕</button></div></div>`}).join('')}
 <div style="margin-top:14px"><div class="tot"><span>${t('sub')}</span><span>${fmt(T.sub)}</span></div><div class="tot"><span>${t('ship')}</span><span>${T.ship?fmt(T.ship):t('free')}</span></div><div class="tot b"><span>${t('total')}</span><span>${fmt(T.tot)}</span></div></div>
 <button class="btn" onclick="checkoutM()">${t('checkout')}</button>`,'side');
}
function chg(i,d){const c=ST.cart[i],p=prod(c.id);
 if(d>0&&ST.cart.filter(x=>x.id==c.id).reduce((a,x)=>a+x.qty,0)>=p.stock)return toast(t('nstock'));
 c.qty+=d;if(c.qty<1)ST.cart.splice(i,1);render();cartM()}
function rm(i){ST.cart.splice(i,1);render();cartM()}
function checkoutM(){const T=totals();
 M(`<h2>${t('checkout')}</h2><form onsubmit="placeOrder(event)">
 <label class="f">${t('name')}<input class="in" name="n" required maxlength="80"></label>
 <label class="f">${t('phone')}<input class="in" name="p" type="tel" required pattern="[0-9+ ]{8,15}" dir="ltr"></label>
 <label class="f">${t('wil')}<input class="in" name="w" required maxlength="60"></label>
 <label class="f">${t('addr')}<input class="in" name="a" required maxlength="160"></label>
 <p style="margin-top:12px">💵 ${t('cod')}</p>
 <div class="tot b"><span>${t('total')}</span><span>${fmt(T.tot)}</span></div>
 <button class="btn" type="submit">${t('place')}</button></form>`,'');
}
function placeOrder(e){e.preventDefault();const f=new FormData(e.target),T=totals();
 for(const c of ST.cart){const need=ST.cart.filter(x=>x.id==c.id).reduce((a,x)=>a+x.qty,0);if(need>prod(c.id).stock){toast(t('nstock'));return}}
 const o={id:DB.n++,date:new Date().toISOString(),status:'new',total:T.tot,ship:T.ship,
  cust:{n:f.get('n'),p:f.get('p'),w:f.get('w'),a:f.get('a')},
  items:ST.cart.map(c=>{const p=prod(c.id);p.stock-=c.qty;return{id:p.id,ar:p.ar,en:p.en,size:c.size,qty:c.qty,price:p.price}})};
 DB.orders.unshift(o);save();ST.cart=[];render();
 M(`<div style="text-align:center;padding:20px 0"><div style="font-size:60px">✅</div><h2>${t('ok')}</h2><p style="color:var(--mut)">${t('ordno')}: #${o.id}</p><p class="pr" style="margin-top:8px">${fmt(o.total)}</p><button class="btn" onclick="closeM()">OK</button></div>`);
}
/* ---------- Admin ---------- */
function toggleAdmin(){
 if(ST.view=='admin'){ST.view='shop';return render()}
 if(ST.auth){ST.view='admin';return render()}
 M(`<h2>${t('admin')}</h2><form onsubmit="login(event)"><label class="f">${t('pin')}<input class="in" name="c" type="password" required dir="ltr"></label><button class="btn" type="submit">${t('enter')}</button></form>`);
}
function login(e){e.preventDefault();if(new FormData(e.target).get('c')==DB.pin){ST.auth=true;ST.view='admin';closeM();render()}else toast(t('wrong'))}
function adminHTML(){
 const tabs=['ov','prods','ords'];
 return`<div class="tabs">${tabs.map(k=>`<button class="chip ${ST.tab==k?'on':''}" onclick="ST.tab='${k}';render()">${t(k)}</button>`).join('')}</div>`+(ST.tab=='ov'?ovHTML():ST.tab=='prods'?prodsHTML():ordsHTML());
}
function ovHTML(){const live=DB.orders.filter(o=>o.status!='canc'),low=DB.products.filter(p=>p.stock<5);
 return`<div class="stats"><div class="st"><b>${fmt(live.reduce((a,o)=>a+o.total,0))}</b><span>${t('rev')}</span></div><div class="st"><b>${DB.orders.length}</b><span>${t('ords')}</span></div><div class="st"><b>${DB.products.length}</b><span>${t('prods')}</span></div><div class="st"><b class="low">${low.length}</b><span>${t('low')}</span></div></div>
 <h3 style="margin:8px 0">${t('lowl')}</h3><div class="tw"><table>${low.map(p=>`<tr><td>${p.icon} ${nm(p)}</td><td class="low">${p.stock}</td></tr>`).join('')||'<tr><td>—</td></tr>'}</table></div>
 <button class="btn g s" style="margin-top:16px" onclick="if(confirm(t('confirm'))){DB=seed();save();render()}">${t('reset')}</button>`}
function prodsHTML(){
 return`<button class="btn s" style="margin-bottom:12px" onclick="formM()">${t('newp')}</button><div class="tw"><table><tr><th></th><th>${t('prods')}</th><th>${t('cat')}</th><th>${t('price')}</th><th>${t('stock')}</th><th></th></tr>
 ${DB.products.map(p=>`<tr><td>${p.icon}</td><td>${nm(p)}</td><td>${t(p.cat)}</td><td>${fmt(p.price)}</td><td><input type="number" min="0" value="${p.stock}" class="${p.stock<5?'low':''}" onchange="setStock(${p.id},this.value)"></td><td><button class="btn g s" onclick="formM(${p.id})">${t('edit')}</button> <button class="btn d s" onclick="delP(${p.id})">${t('del')}</button></td></tr>`).join('')}</table></div>`}
function setStock(id,v){prod(id).stock=Math.max(0,parseInt(v)||0);save();render()}
function delP(id){if(!confirm(t('confirm')))return;DB.products=DB.products.filter(p=>p.id!=id);ST.cart=ST.cart.filter(c=>c.id!=id);save();render()}
function formM(id){const p=id?prod(id):{ar:'',en:'',cat:'women',price:'',old:'',stock:10,sizes:['M'],icon:'👕',h:30};
 M(`<h2>${id?t('edit'):t('newp')}</h2><form onsubmit="saveP(event,${id||0})">
 <label class="f">${t('nar')}<input class="in" name="ar" required value="${esc(p.ar)}"></label>
 <label class="f">${t('nen')}<input class="in" name="en" required value="${esc(p.en)}" dir="ltr"></label>
 <label class="f">${t('cat')}<select class="in" name="cat">${['women','men','kids','acc'].map(c=>`<option value="${c}" ${p.cat==c?'selected':''}>${t(c)}</option>`).join('')}</select></label>
 <label class="f">${t('price')}<input class="in" name="price" type="number" min="1" required value="${p.price}"></label>
 <label class="f">${t('old')}<input class="in" name="old" type="number" min="0" value="${p.old||''}"></label>
 <label class="f">${t('stock')}<input class="in" name="stock" type="number" min="0" required value="${p.stock}"></label>
 <label class="f">${t('sizes')}<input class="in" name="sizes" required value="${esc(p.sizes.join(','))}" dir="ltr"></label>
 <label class="f">${t('icon')}<input class="in" name="icon" required maxlength="4" value="${esc(p.icon)}"></label>
 <button class="btn" type="submit">${t('save')}</button></form>`)}
function saveP(e,id){e.preventDefault();const f=new FormData(e.target);
 const d={ar:f.get('ar').trim(),en:f.get('en').trim(),cat:f.get('cat'),price:+f.get('price'),old:+f.get('old')||0,stock:+f.get('stock'),icon:f.get('icon'),
  sizes:f.get('sizes').split(',').map(s=>s.trim()).filter(Boolean)};
 if(id)Object.assign(prod(id),d);else DB.products.push({id:DB.nid++,h:Math.floor(Math.random()*360),...d});
 save();closeM();render()}
function ordsHTML(){
 if(!DB.orders.length)return`<p class="empty">${t('noord')}</p>`;
 return DB.orders.map(o=>`<div class="oc"><header><span>#${o.id} · ${esc(o.cust.n)}</span><span>${fmt(o.total)}</span></header>
 <small style="color:var(--mut)">${new Date(o.date).toLocaleString(ST.lang=='ar'?'ar-DZ':'en-GB')} · <span dir="ltr">${esc(o.cust.p)}</span> · ${esc(o.cust.w)}, ${esc(o.cust.a)}</small>
 <ul style="margin:8px 0;padding-inline-start:20px">${o.items.map(i=>`<li>${esc(i[ST.lang])} (${esc(i.size)}) × ${i.qty}</li>`).join('')}</ul>
 <select class="in" style="width:auto" onchange="setStatus(${o.id},this.value)">${STAT.map(s=>`<option value="${s}" ${o.status==s?'selected':''}>${t('s_'+s)}</option>`).join('')}</select></div>`).join('')}
function setStatus(id,v){const o=DB.orders.find(x=>x.id==id);
 const adj=d=>o.items.forEach(i=>{const p=prod(i.id);if(p)p.stock=Math.max(0,p.stock+d*i.qty)});
 if(v=='canc'&&o.status!='canc')adj(1);else if(o.status=='canc'&&v!='canc')adj(-1);
 o.status=v;save();render()}
render();
</script>
</body>
</html>
