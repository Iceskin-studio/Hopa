openapi: 3.0.3
info:
  title: Arabic Greeting API
  version: 1.0.0
  description: |
    Minimal API contract for the Arabic Greeting web application.
    The service provides a health check endpoint, a static HTML page,
    and a JSON greeting endpoint.
servers:
  - url: http://{host}:{port}
    description: Development server
    variables:
      host:
        default: localhost
      port:
        default: "3000"
paths:
  /healthz:
    get:
      summary: Health check
      description: Returns basic health information about the service.
      parameters:
        - in: query
          name: db
          schema:
            type: boolean
          description: If true, perform a DB connectivity check.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/greeting:
    get:
      summary: Get Arabic greeting
      description: Returns the greeting "اهلا" in JSON format.
      responses:
        '200':
          description: Greeting retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreetingResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - env
        - uptime
      properties:
        status:
          type: string
          example: ok
        env:
          type: string
          description: Current NODE_ENV value
          example: development
        uptime:
          type: number
          format: float
          description: Process uptime in seconds
          example: 12.345
        timestamp:
          type: string
          format: date-time
          description: Current server timestamp
          example: 2024-01-01T12:00:00Z
        db:
          type: string
          description: DB connectivity status (connected|error)
          example: connected
        dbError:
          type: string
          description: Optional DB error message when status is degraded
          example: authentication failed
    GreetingResponse:
      type: object
      required:
        - greeting
      properties:
        greeting:
          type: string
          description: Arabic greeting
          example: اهلا
